server:
  port: 8080

spring:
  application:
    name: zendrive-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/zendrive
    username: ${DB_USERNAME:zendrive}
    password: ${DB_PASSWORD:zendrive}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@zendrive.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret-key: ${JWT_SECRET:ZGVmYXVsdC1zZWNyZXQta2V5LWZvci16ZW5kcml2ZS1hcHBsaWNhdGlvbi0yMDI0}
  expiration-time: 86400000

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:3000}
  upload-dir: ${UPLOAD_DIR:./uploads}
  base-url: ${APP_BASE_URL:http://localhost:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
